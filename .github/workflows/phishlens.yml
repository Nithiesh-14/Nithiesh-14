name: PhishLens tests
on:
  push:
    paths:
      - "PhishLens/**"
      - ".github/workflows/phishlens.yml"
  pull_request:
    paths:
      - "PhishLens/**"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PhishLens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
